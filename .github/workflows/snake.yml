# Dibuja el gráfico de contribuciones como una serpiente animada (rama «output»)
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8b5cf6&color_dots=#161b22,#2b2d6e,#4b4fc4,#7c5cff,#a78bfa
            dist/snake-light.svg?color_snake=#5865f2&color_dots=#ebedf0,#c7cbff,#9aa1ff,#6d72f5,#5865f2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
