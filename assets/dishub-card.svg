<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="DisHub: directorio en español de bots, servidores, plantillas y emojis de Discord">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1122"/>
      <stop offset="1" stop-color="#151834"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="r"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .h { font-size: 34px; font-weight: 800; fill: #fff; letter-spacing: -.5px; }
    .p { font-size: 17px; fill: #b6bce6; }
    .f { font-size: 15px; font-weight: 600; fill: #e5e7ff; }
    .s { font-size: 13px; fill: #8b93c9; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35 } }
  </style>
  <g clip-path="url(#r)" class="t">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect x="1" y="1" width="898" height="258" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    <rect width="900" height="4" fill="url(#line)"/>

    <!-- Logo -->
    <g transform="translate(36 40) scale(1.3125)">
      <rect width="64" height="64" rx="16" fill="url(#line2)"/>
      <path d="M17 15h15a17 17 0 0 1 0 34h-7l-8 6.5V15z" fill="#fff"/>
      <path d="M32 23.5c.9 5.6 2.9 7.6 8.5 8.5-5.6.9-7.6 2.9-8.5 8.5-.9-5.6-2.9-7.6-8.5-8.5 5.6-.9 7.6-2.9 8.5-8.5z" fill="url(#line2)"/>
    </g>

    <text x="142" y="76" class="h">DisHub</text>
    <circle cx="314" cy="66" r="6" fill="#34d399" class="live"/>
    <text x="328" y="71" class="s">online · dishublist.com</text>
    <text x="142" y="106" class="p">Directorio en español de bots, servidores, plantillas y emojis de Discord.</text>

    <g transform="translate(36 150)">
      <rect width="196" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="16" y="32" class="f">🤖 Bot propio</text>
      <text x="16" y="56" class="s">/votar · /bump · /preguntar</text>

      <rect x="210" width="196" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="226" y="32" class="f">💬 Asistente con IA</text>
      <text x="226" y="56" class="s">Soporte 24/7 en web y Discord</text>

      <rect x="420" width="196" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="436" y="32" class="f">🛡️ Revisión segura</text>
      <text x="436" y="56" class="s">Pruebas + auditoría de staff</text>

      <rect x="630" width="198" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="646" y="32" class="f">🔌 API pública</text>
      <text x="646" y="56" class="s">Votos, widgets e insignias</text>
    </g>
  </g>
</svg>
